<!DOCTYPE html>
<html lang="es" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard de Gobierno de Datos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <div class="d-flex" id="wrapper">
        <!-- Sidebar -->
        <div class="bg-dark border-right" id="sidebar-wrapper">
            <div class="sidebar-heading text-white">Gobierno de Datos</div>
            <div class="list-group list-group-flush">
                <a href="modulos/dashboard.html" class="list-group-item list-group-item-action bg-dark text-white" target="iframe-content">
                    <i class="bi bi-speedometer2 me-2"></i> Dashboard General
                </a>
                <a href="modulos/glosario.html" class="list-group-item list-group-item-action bg-dark text-white" target="iframe-content">
                    <i class="bi bi-book me-2"></i> Glosario de Negocio
                </a>
                <a href="modulos/diccionario.html" class="list-group-item list-group-item-action bg-dark text-white" target="iframe-content">
                    <i class="bi bi-journal-text me-2"></i> Diccionario de Datos
                </a>
                <a href="modulos/calidad_datos.html" class="list-group-item list-group-item-action bg-dark text-white" target="iframe-content">
                    <i class="bi bi-check-circle me-2"></i> Calidad de Datos
                </a>
                <a href="modulos/seguridad.html" class="list-group-item list-group-item-action bg-dark text-white" target="iframe-content">
                    <i class="bi bi-shield-lock me-2"></i> Seguridad y Perfilamiento
                </a>
                <a href="modulos/arquitectura.html" class="list-group-item list-group-item-action bg-dark text-white" target="iframe-content">
                    <i class="bi bi-diagram-3 me-2"></i> Arquitectura Empresarial
                </a>
                <a href="modulos/activos.html" class="list-group-item list-group-item-action bg-dark text-white" target="iframe-content">
                    <i class="bi bi-box-seam me-2"></i> Catálogo de Activos
                </a>
                <a href="modulos/gobierno_metadatos.html" class="list-group-item list-group-item-action bg-dark text-white" target="iframe-content">
                    <i class="bi bi-gear me-2"></i> Gobierno de Metadatos
                </a>
                <a href="modulos/politicas.html" class="list-group-item list-group-item-action bg-dark text-white" target="iframe-content">
                    <i class="bi bi-file-earmark-ruled me-2"></i> Políticas y Normativas
                </a>
                <a href="modulos/incidentes.html" class="list-group-item list-group-item-action bg-dark text-white" target="iframe-content">
                    <i class="bi bi-exclamation-triangle me-2"></i> Gestión de Incidentes
                </a>
            </div>
        </div>
        <!-- /#sidebar-wrapper -->

        <!-- Page Content -->
        <div id="page-content-wrapper">
            <nav class="navbar navbar-expand-lg navbar-light bg-light border-bottom">
                <div class="container-fluid">
                    <button class="btn btn-primary" id="menu-toggle"><i class="bi bi-list"></i></button>

                    <form class="d-flex ms-auto">
                        <input class="form-control me-2" type="search" placeholder="Buscar activo..." aria-label="Buscar">
                        <button class="btn btn-outline-success" type="submit">Buscar</button>
                    </form>

                    <ul class="navbar-nav ms-auto mt-2 mt-lg-0">
                        <li class="nav-item">
                            <div class="form-check form-switch mt-2">
                                <input class="form-check-input" type="checkbox" id="theme-switch">
                                <label class="form-check-label" for="theme-switch"><i class="bi bi-moon-stars-fill"></i></label>
                            </div>
                        </li>
                        <li class="nav-item dropdown">
                            <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button" data-bs-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                                <i class="bi bi-person-circle"></i> <span id="navbar-user-name">Usuario</span>
                            </a>
                            <div class="dropdown-menu dropdown-menu-end" aria-labelledby="navbarDropdown">
                                <a class="dropdown-item" href="modulos/perfil.html" target="iframe-content">Mi Perfil</a>
                                <a class="dropdown-item" href="modulos/configuracion.html" target="iframe-content">Configuración</a>
                                <div class="dropdown-divider"></div>
                                <a class="dropdown-item" href="#">Cerrar Sesión</a>
                            </div>
                        </li>
                    </ul>
                </div>
            </nav>

            <div class="container-fluid p-3">
                <iframe name="iframe-content" src="modulos/dashboard.html" style="width: 100%; height: 88vh; border: none;"></iframe>
            </div>
        </div>
        <!-- /#page-content-wrapper -->
    </div>
    <!-- /#wrapper -->

    <!-- Toast Container -->
    <div class="position-fixed bottom-0 end-0 p-3" style="z-index: 1100" id="toast-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
