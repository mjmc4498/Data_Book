<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
<div class="container-fluid">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="../index.html" target="_top">Inicio</a></li>
            <li class="breadcrumb-item active" aria-current="page">Mi Perfil</li>
        </ol>
    </nav>

    <h1 class="h2 mb-4">Mi Perfil</h1>

    <div class="row">
        <div class="col-md-4 text-center">
            <img src="https://i.pravatar.cc/150?u=a042581f4e29026704d" class="img-fluid rounded-circle mb-3" alt="Avatar de usuario">
            <h4 id="profile-name-display">Usuario de Prueba</h4>
            <p class="text-muted" id="profile-role-display">Analista de Datos</p>
        </div>
        <div class="col-md-8">
            <div class="card">
                <div class="card-header">
                    Editar Información del Perfil
                </div>
                <div class="card-body">
                    <form id="profile-form">
                        <div class="mb-3">
                            <label for="profile-name" class="form-label">Nombre de Usuario</label>
                            <input type="text" class="form-control" id="profile-name" placeholder="Introduce tu nombre">
                        </div>
                        <div class="mb-3">
                            <label for="profile-role" class="form-label">Rol</label>
                            <select class="form-select" id="profile-role">
                                <option value="Analista de Datos">Analista de Datos</option>
                                <option value="Data Steward">Data Steward</option>
                                <option value="Oficial de Privacidad">Oficial de Privacidad</option>
                                <option value="Administrador">Administrador</option>
                            </select>
                        </div>
                         <div class="mb-3">
                            <label for="profile-email" class="form-label">Correo Electrónico</label>
                            <input type="email" class="form-control" id="profile-email" value="usuario@example.com" disabled>
                            <small class="form-text text-muted">El correo electrónico no se puede cambiar.</small>
                        </div>
                        <button type="submit" class="btn btn-primary">Guardar Cambios</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="../js/perfil.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
