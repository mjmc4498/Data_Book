<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
<div class="container-fluid">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="#">Inicio</a></li>
            <li class="breadcrumb-item active" aria-current="page">Seguridad y Perfilamiento</li>
        </ol>
    </nav>
    <h1 class="h2">Catálogo de Roles y Permisos</h1>

    <ul class="nav nav-tabs" id="myTab" role="tablist">
      <li class="nav-item" role="presentation">
        <button class="nav-link active" id="roles-tab" data-bs-toggle="tab" data-bs-target="#roles" type="button" role="tab" aria-controls="roles" aria-selected="true">Roles</button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" id="audit-tab" data-bs-toggle="tab" data-bs-target="#audit" type="button" role="tab" aria-controls="audit" aria-selected="false">Auditoría de Accesos</button>
      </li>
    </ul>
    <div class="tab-content" id="myTabContent">
      <div class="tab-pane fade show active" id="roles" role="tabpanel" aria-labelledby="roles-tab">
        <div class="table-responsive mt-3">
            <table class="table">
                <thead>
                    <tr><th>Rol</th><th>Descripción</th><th>Permisos</th><th>Acciones</th></tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Analista de Datos</td>
                        <td>Acceso de lectura a datos no sensibles.</td>
                        <td><code>SELECT</code> en <code>schema_public</code></td>
                        <td><button class="btn btn-sm btn-warning"><i class="bi bi-pencil"></i></button></td>
                    </tr>
                </tbody>
            </table>
        </div>
      </div>
      <div class="tab-pane fade" id="audit" role="tabpanel" aria-labelledby="audit-tab">
        <p class="mt-3">Registros de auditoría de acceso a datos...</p>
      </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
