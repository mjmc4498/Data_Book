<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
<div class="container-fluid">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="#">Inicio</a></li>
            <li class="breadcrumb-item active" aria-current="page">Glosario de Negocio</li>
        </ol>
    </nav>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h2">Glosario de Negocio</h1>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addTermModal">
            <i class="bi bi-plus-circle me-2"></i> Añadir Nuevo Término
        </button>
    </div>

    <!-- Filtros -->
    <div class="card mb-3">
        <div class="card-body">
            <div class="row g-3">
                <div class="col-md-4">
                    <input type="text" class="form-control" placeholder="Buscar por nombre...">
                </div>
                <div class="col-md-3">
                    <select class="form-select">
                        <option selected>Filtrar por estado...</option>
                        <option value="1">Aprobado</option>
                        <option value="2">Pendiente</option>
                        <option value="3">Rechazado</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <select class="form-select">
                        <option selected>Filtrar por dominio...</option>
                        <option value="1">Ventas</option>
                        <option value="2">Marketing</option>
                        <option value="3">Finanzas</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <button class="btn btn-outline-secondary w-100">Filtrar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Tabla de Términos -->
    <div class="table-responsive">
        <table class="table table-striped table-hover">
            <thead class="table-dark">
                <tr>
                    <th scope="col">Término</th>
                    <th scope="col">Definición</th>
                    <th scope="col">Dominio</th>
                    <th scope="col">Estado</th>
                    <th scope="col">Versión</th>
                    <th scope="col">Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Cliente</td>
                    <td>Persona o empresa que adquiere bienes o servicios.</td>
                    <td>Ventas</td>
                    <td><span class="badge bg-success">Aprobado</span></td>
                    <td>2.1</td>
                    <td>
                        <button class="btn btn-sm btn-info" data-bs-toggle="tooltip" title="Ver Detalles"><i class="bi bi-eye"></i></button>
                        <button class="btn btn-sm btn-warning" data-bs-toggle="tooltip" title="Editar"><i class="bi bi-pencil"></i></button>
                        <button class="btn btn-sm btn-danger" data-bs-toggle="tooltip" title="Eliminar"><i class="bi bi-trash"></i></button>
                    </td>
                </tr>
                <!-- más filas... -->
            </tbody>
        </table>
    </div>

    <!-- Modal para Añadir Término -->
    <div class="modal fade" id="addTermModal" tabindex="-1" aria-labelledby="addTermModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="addTermModalLabel">Añadir Nuevo Término</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form>
                        <div class="mb-3">
                            <label for="termName" class="form-label">Nombre del Término</label>
                            <input type="text" class="form-control" id="termName">
                        </div>
                        <div class="mb-3">
                            <label for="termDefinition" class="form-label">Definición</label>
                            <textarea class="form-control" id="termDefinition" rows="3"></textarea>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="termDomain" class="form-label">Dominio</label>
                                <select class="form-select" id="termDomain">
                                    <option selected>Seleccionar...</option>
                                    <option value="1">Ventas</option>
                                    <option value="2">Marketing</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="termStatus" class="form-label">Estado</label>
                                <select class="form-select" id="termStatus">
                                    <option value="1">Pendiente</option>
                                    <option value="2">Aprobado</option>
                                </select>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                    <button type="button" class="btn btn-primary">Guardar Término</button>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // Re-initialize tooltips for this iframe content
    const tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'));
    tooltipTriggerList.map(function (tooltipTriggerEl) {
        return new bootstrap.Tooltip(tooltipTriggerEl);
    });
</script>
</body>
</html>
