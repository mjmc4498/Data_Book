<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
<div class="container-fluid">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="../index.html" target="_top">Inicio</a></li>
            <li class="breadcrumb-item active" aria-current="page">Glosario de Negocio</li>
        </ol>
    </nav>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h2">Glosario de Negocio</h1>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#termModal">
            <i class="bi bi-plus-circle me-2"></i> Añadir Nuevo Término
        </button>
    </div>

    <!-- Filtros -->
    <div class="card mb-3">
        <div class="card-body">
            <form id="filter-form" class="row g-3">
                <div class="col-md-5">
                    <input type="text" class="form-control" id="search-input" placeholder="Buscar por nombre o definición...">
                </div>
                <div class="col-md-3">
                    <select class="form-select" id="status-filter">
                        <option value="">Todos los estados</option>
                        <option value="Aprobado">Aprobado</option>
                        <option value="Pendiente">Pendiente</option>
                        <option value="Rechazado">Rechazado</option>
                    </select>
                </div>
                <div class="col-md-3">
                     <select class="form-select" id="domain-filter">
                        <option value="">Todos los dominios</option>
                        <option value="Ventas">Ventas</option>
                        <option value="Marketing">Marketing</option>
                        <option value="Finanzas">Finanzas</option>
                    </select>
                </div>
                <div class="col-md-1">
                    <button type="reset" class="btn btn-outline-secondary w-100" id="reset-filters">
                        <i class="bi bi-x-lg"></i>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Tabla de Términos -->
    <div class="table-responsive">
        <table class="table table-striped table-hover">
            <thead class="table-dark">
                <tr>
                    <th scope="col">Término</th>
                    <th scope="col">Definición</th>
                    <th scope="col">Dominio</th>
                    <th scope="col">Estado</th>
                    <th scope="col">Versión</th>
                    <th scope="col">Acciones</th>
                </tr>
            </thead>
            <tbody id="terms-table-body">
                <!-- Las filas se generarán dinámicamente -->
            </tbody>
        </table>
        <p id="no-data-message" class="text-center text-muted d-none">No hay términos registrados. ¡Añade uno!</p>
    </div>

    <!-- Modal para Añadir/Editar Término -->
    <div class="modal fade" id="termModal" tabindex="-1" aria-labelledby="termModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="termModalLabel">Añadir Nuevo Término</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="term-form" class="needs-validation" novalidate>
                        <input type="hidden" id="term-id">
                        <div class="mb-3">
                            <label for="term-name" class="form-label">Nombre del Término</label>
                            <input type="text" class="form-control" id="term-name" required>
                            <div class="invalid-feedback">Por favor, introduce un nombre para el término.</div>
                        </div>
                        <div class="mb-3">
                            <label for="term-definition" class="form-label">Definición</label>
                            <textarea class="form-control" id="term-definition" rows="3" required></textarea>
                            <div class="invalid-feedback">Por favor, introduce una definición.</div>
                        </div>
                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label for="term-domain" class="form-label">Dominio</label>
                                <select class="form-select" id="term-domain" required>
                                    <option value="" disabled selected>Seleccionar...</option>
                                    <option value="Ventas">Ventas</option>
                                    <option value="Marketing">Marketing</option>
                                    <option value="Finanzas">Finanzas</option>
                                </select>
                                <div class="invalid-feedback">Por favor, selecciona un dominio.</div>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label for="term-status" class="form-label">Estado</label>
                                <select class="form-select" id="term-status" required>
                                    <option value="Pendiente">Pendiente</option>
                                    <option value="Aprobado">Aprobado</option>
                                    <option value="Rechazado">Rechazado</option>
                                </select>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label for="term-version" class="form-label">Versión</label>
                                <input type="text" class="form-control" id="term-version" value="1.0" required>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                    <button type="submit" class="btn btn-primary" form="term-form">Guardar Cambios</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="../js/glosario.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
