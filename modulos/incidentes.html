<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
<div class="container-fluid">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="../index.html" target="_top">Inicio</a></li>
            <li class="breadcrumb-item active" aria-current="page">Gestión de Incidentes</li>
        </ol>
    </nav>
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h2">Registro de Incidentes</h1>
        <button class="btn btn-danger" data-bs-toggle="modal" data-bs-target="#incidentModal"><i class="bi bi-plus-circle me-2"></i> Registrar Incidente</button>
    </div>

    <!-- Filtros -->
    <div class="card mb-3">
        <div class="card-body">
            <form id="filter-form" class="row g-3 align-items-center">
                <div class="col-md-4">
                    <input type="text" class="form-control" id="search-input" placeholder="Buscar por descripción o activo...">
                </div>
                <div class="col-md-2">
                    <select id="status-filter" class="form-select">
                        <option value="">Todos los estados</option>
                        <option value="Reportado">Reportado</option>
                        <option value="En Investigación">En Investigación</option>
                        <option value="Solucionado">Solucionado</option>
                        <option value="Cerrado">Cerrado</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <input type="date" class="form-control" id="start-date-filter" title="Fecha de inicio">
                </div>
                <div class="col-md-2">
                     <input type="date" class="form-control" id="end-date-filter" title="Fecha de fin">
                </div>
                <div class="col-md-2">
                    <button type="reset" class="btn btn-outline-secondary w-100">Limpiar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Tabla de Incidentes -->
    <div class="table-responsive">
        <table class="table table-hover">
            <thead>
                <tr><th>ID</th><th>Descripción</th><th>Activo Afectado</th><th>Estado</th><th>Fecha Reporte</th><th>Asignado a</th><th>Acciones</th></tr>
            </thead>
            <tbody id="incidents-table-body"><!-- Filas generadas por JS --></tbody>
        </table>
    </div>

    <!-- Modal para Añadir/Editar Incidente -->
    <div class="modal fade" id="incidentModal" tabindex="-1" aria-labelledby="incidentModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header"><h5 class="modal-title" id="incidentModalLabel">Registrar Incidente</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
                <div class="modal-body">
                    <form id="incident-form" class="needs-validation" novalidate>
                        <input type="hidden" id="incident-id">
                        <div class="mb-3"><label for="incident-description" class="form-label">Descripción</label><textarea class="form-control" id="incident-description" rows="3" required></textarea><div class="invalid-feedback">La descripción es obligatoria.</div></div>
                        <div class="row">
                            <div class="col-md-6 mb-3"><label for="incident-asset" class="form-label">Activo Afectado</label><input type="text" class="form-control" id="incident-asset" required><div class="invalid-feedback">Especifica el activo.</div></div>
                            <div class="col-md-6 mb-3"><label for="incident-assigned" class="form-label">Asignado a</label><input type="text" class="form-control" id="incident-assigned" required><div class="invalid-feedback">Asigna el incidente.</div></div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3"><label for="incident-status" class="form-label">Estado</label><select class="form-select" id="incident-status" required><option value="Reportado">Reportado</option><option value="En Investigación">En Investigación</option><option value="Solucionado">Solucionado</option><option value="Cerrado">Cerrado</option></select></div>
                            <div class="col-md-6 mb-3"><label for="incident-date" class="form-label">Fecha de Reporte</label><input type="date" class="form-control" id="incident-date" required><div class="invalid-feedback">La fecha es obligatoria.</div></div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button><button type="submit" class="btn btn-primary" form="incident-form">Guardar</button></div>
            </div>
        </div>
    </div>
</div>
<script src="../js/incidentes.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
