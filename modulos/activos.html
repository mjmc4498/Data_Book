<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
<div class="container-fluid">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="../index.html" target="_top">Inicio</a></li>
            <li class="breadcrumb-item active" aria-current="page">Catálogo de Activos de Datos</li>
        </ol>
    </nav>
    <h1 class="h2">Catálogo de Activos de Datos</h1>
    <p>Explore todos los activos de datos registrados en la organización.</p>

    <div class="row">
        <div class="col-md-3">
            <!-- Filtros y facetas -->
            <form id="filter-form">
                <div class="mb-3">
                    <label for="search-input" class="form-label fw-bold">Buscar</label>
                    <input type="text" id="search-input" class="form-control" placeholder="Buscar por nombre o descripción...">
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Tipo de Activo</label>
                    <div class="list-group" id="asset-type-filter">
                        <label class="list-group-item">
                            <input class="form-check-input me-1" type="checkbox" value="Tabla"> Tabla de Base de Datos
                        </label>
                        <label class="list-group-item">
                            <input class="form-check-input me-1" type="checkbox" value="Reporte"> Reporte BI
                        </label>
                        <label class="list-group-item">
                            <input class="form-check-input me-1" type="checkbox" value="API"> API
                        </label>
                    </div>
                </div>
                 <div class="mb-3">
                    <label class="form-label fw-bold">Clasificación</label>
                    <div class="list-group" id="classification-filter">
                        <label class="list-group-item">
                            <input class="form-check-input me-1" type="checkbox" value="Público"> Público
                        </label>
                        <label class="list-group-item">
                            <input class="form-check-input me-1" type="checkbox" value="Interno"> Interno
                        </label>
                         <label class="list-group-item">
                            <input class="form-check-input me-1" type="checkbox" value="Confidencial"> Confidencial
                        </label>
                    </div>
                </div>
                 <button type="reset" class="btn btn-outline-secondary w-100">Limpiar Filtros</button>
            </form>
        </div>
        <div class="col-md-9">
            <h5 id="results-count" class="mb-3">Mostrando 0 activos</h5>
            <!-- Resultados -->
            <div id="assets-container">
                <!-- Tarjetas de activos generadas por JS -->
            </div>
            <p id="no-results-message" class="text-center text-muted d-none">No se encontraron activos que coincidan con los filtros.</p>
        </div>
    </div>
</div>

<script src="../js/activos.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
