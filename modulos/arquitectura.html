<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/styles.css">
    <style>
        #diagram-container {
            width: 100%;
            height: 75vh;
            border: 1px solid #ccc;
            background-color: #f8f9fa;
        }
        [data-bs-theme="dark"] #diagram-container {
            border-color: #495057;
            background-color: #343a40;
        }
    </style>
</head>
<body>
<div class="container-fluid">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="../index.html" target="_top">Inicio</a></li>
            <li class="breadcrumb-item active" aria-current="page">Arquitectura y Linaje de Datos</li>
        </ol>
    </nav>

    <div class="row">
        <!-- Panel de Control -->
        <div class="col-md-3">
            <h4 class="mb-3">Controles del Diagrama</h4>
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">Añadir Tabla/Sistema</h5>
                    <form id="add-node-form">
                        <div class="mb-2">
                            <label for="node-name" class="form-label">Nombre</label>
                            <input type="text" id="node-name" class="form-control" placeholder="Ej: CRM.CLIENTES" required>
                        </div>
                        <div class="mb-2">
                            <label for="node-type" class="form-label">Tipo</label>
                            <select id="node-type" class="form-select">
                                <option value="table">Tabla</option>
                                <option value="system">Sistema</option>
                                <option value="etl">Proceso ETL</option>
                                <option value="report">Reporte</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Añadir Nodo</button>
                    </form>
                    <hr>
                    <p class="text-muted small">
                        Para conectar nodos, haz clic y arrastra desde el borde de un nodo hacia otro. Para eliminar un elemento, selecciónalo y presiona la tecla 'Supr'.
                    </p>
                </div>
            </div>
            <div class="card mt-3">
                <div class="card-body">
                     <h5 class="card-title">Exportar</h5>
                     <div class="d-grid gap-2">
                        <button class="btn btn-outline-secondary" id="export-jpg-btn"><i class="bi bi-image me-2"></i> Exportar como JPG</button>
                        <button class="btn btn-outline-danger" id="export-pdf-btn"><i class="bi bi-file-earmark-pdf me-2"></i> Exportar como PDF</button>
                     </div>
                </div>
            </div>
        </div>

        <!-- Lienzo del Diagrama -->
        <div class="col-md-9">
            <div id="diagram-container"></div>
        </div>
    </div>
</div>

<script src="../js/arquitectura.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
