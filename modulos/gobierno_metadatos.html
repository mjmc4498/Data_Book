<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
<div class="container-fluid">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="../index.html" target="_top">Inicio</a></li>
            <li class="breadcrumb-item active" aria-current="page">Gobierno de Metadatos</li>
        </ol>
    </nav>
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h2">Flujos de Aprobación</h1>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#flowModal"><i class="bi bi-plus-circle me-2"></i> Añadir Flujo</button>
    </div>

    <!-- Filtro -->
    <div class="mb-3">
        <input type="text" id="search-input" class="form-control" placeholder="Buscar flujo por nombre o descripción...">
    </div>

    <div class="accordion" id="flows-accordion">
        <!-- Flujos generados por JS -->
    </div>
    <p id="no-flows-message" class="text-center text-muted mt-4 d-none">No hay flujos definidos.</p>


    <!-- Modal para Añadir/Editar Flujo -->
    <div class="modal fade" id="flowModal" tabindex="-1" aria-labelledby="flowModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header"><h5 class="modal-title" id="flowModalLabel">Añadir Flujo</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
                <div class="modal-body">
                    <form id="flow-form" class="needs-validation" novalidate>
                        <input type="hidden" id="flow-id">
                        <div class="mb-3"><label for="flow-name" class="form-label">Nombre</label><input type="text" class="form-control" id="flow-name" placeholder="Ej: Aprobación de Término" required><div class="invalid-feedback">El nombre es obligatorio.</div></div>
                        <div class="mb-3"><label for="flow-description" class="form-label">Descripción</label><textarea class="form-control" id="flow-description" rows="2" required></textarea><div class="invalid-feedback">La descripción es obligatoria.</div></div>
                        <div class="mb-3"><label for="flow-steps" class="form-label">Pasos (uno por línea)</label><textarea class="form-control" id="flow-steps" rows="4" placeholder="1. Creación&#10;2. Revisión&#10;3. Aprobación" required></textarea><div class="invalid-feedback">Debe definir al menos un paso.</div></div>
                    </form>
                </div>
                <div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button><button type="submit" class="btn btn-primary" form="flow-form">Guardar</button></div>
            </div>
        </div>
    </div>
</div>

<script src="../js/gobierno_metadatos.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
