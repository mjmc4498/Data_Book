<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
<div class="container-fluid">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="#">Inicio</a></li>
            <li class="breadcrumb-item active" aria-current="page">Diccionario de Datos</li>
        </ol>
    </nav>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h2">Diccionario de Datos</h1>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addAssetModal">
            <i class="bi bi-plus-circle me-2"></i> Registrar Nuevo Activo
        </button>
    </div>

    <!-- Filtros -->
    <div class="card mb-3">
        <div class="card-body">
            <div class="row g-3">
                <div class="col-md-4">
                    <input type="text" class="form-control" placeholder="Buscar por tabla o campo...">
                </div>
                <div class="col-md-3">
                    <select class="form-select">
                        <option selected>Filtrar por sistema fuente...</option>
                        <option value="1">ERP</option>
                        <option value="2">CRM</option>
                        <option value="3">Data Warehouse</option>
                    </select>
                </div>
                <div class="col-md-3">
                     <select class="form-select">
                        <option selected>Filtrar por tipo de dato...</option>
                        <option value="1">VARCHAR</option>
                        <option value="2">INTEGER</option>
                        <option value="3">DATE</option>
                    </select>
                </div>
                 <div class="col-md-2">
                    <button class="btn btn-outline-secondary w-100">Filtrar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Tabla de Activos -->
    <div class="table-responsive">
        <table class="table table-bordered table-hover">
            <thead class="table-light">
                <tr>
                    <th scope="col">Sistema Fuente</th>
                    <th scope="col">Nombre Tabla</th>
                    <th scope="col">Nombre Campo</th>
                    <th scope="col">Tipo de Dato</th>
                    <th scope="col">Término de Negocio Asociado</th>
                    <th scope="col">Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>CRM</td>
                    <td>CLIENTES</td>
                    <td>ID_CLIENTE</td>
                    <td>INTEGER</td>
                    <td><a href="#">Cliente</a></td>
                    <td>
                        <button class="btn btn-sm btn-info" data-bs-toggle="tooltip" title="Ver Linaje"><i class="bi bi-diagram-3"></i></button>
                        <button class="btn btn-sm btn-warning" data-bs-toggle="tooltip" title="Editar Mapeo"><i class="bi bi-pencil"></i></button>
                    </td>
                </tr>
                <!-- más filas... -->
            </tbody>
        </table>
    </div>

</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // Re-initialize tooltips for this iframe content
    const tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'));
    tooltipTriggerList.map(function (tooltipTriggerEl) {
        return new bootstrap.Tooltip(tooltipTriggerEl);
    });
</script>
</body>
</html>
